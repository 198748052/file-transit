<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人文件中转站：登录后上传文件、生成分享链接，文件直传 Cloudflare R2。" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1420" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f7cff'/%3E%3Cpath d='M16 7v11m0 0l-4.5-4.5M16 18l4.5-4.5M8 23h16' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>文件中转站</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f5f7fb;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f1420;
        }
      }
      .boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .boot-ring {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(79, 124, 255, 0.22);
        border-top-color: #4f7cff;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot"><div class="boot-ring" role="status" aria-label="加载中"></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
