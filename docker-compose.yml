services:
  file-transit:
    build: .
    image: file-transit:latest
    container_name: file-transit
    restart: unless-stopped
    # JWT_SECRET / ADMIN_* / R2_* etc. — copy .env.example to .env and edit
    env_file:
      - .env
    # These override .env so the container layout always stays consistent
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8642
      DB_PATH: /app/data/file-transit.db
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # Default binds 0.0.0.0:18642 -> 8642 so panel UIs display the mapping and avoid conflicting with existing 8642 processes.
      # Set HOST_IP=127.0.0.1 in .env if you only want local reverse-proxy access, or HOST_PORT to customize the host port.
      - "${HOST_IP:-0.0.0.0}:${HOST_PORT:-18642}:8642"
    volumes:
      # SQLite database + settings (R2 credentials saved in the panel live here)
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
